<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign Up</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
    <form class="card w-100 shadow border-0" style="max-width:460px" id="signupForm">
      <div class="card-body p-4">
        <h1 class="h4 fw-bold text-center mb-1">Sign Up</h1>
        <p class="text-center text-muted small mb-4">Create your account to get started</p>

        <div class="alert alert-danger py-2 small d-none" id="error" role="alert"></div>
        <div class="mb-3">
          <label for="name" class="form-label small mb-1">Name</label>
          <input type="text" class="form-control" id="name" placeholder="Enter your name" required />
        </div>
        <div class="mb-3">
          <label for="email" class="form-label small mb-1">Email</label>
          <input type="email" class="form-control" id="email" placeholder="Enter your email" required />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label small mb-1">Password</label>
          <input type="password" class="form-control" id="password" placeholder="Enter your password (min 6 characters)" minlength="6" required />
        </div>

        <button type="submit" class="btn btn-primary w-100 fw-semibold mt-2">Sign Up</button>

        <p class="text-center small mt-3 mb-0">Already have an account? <a href="login.html">Login</a></p>
      </div>
    </form>
  </div>

  <script type="module" src="signup.js"></script>
</body>
</html>
