<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
    <form class="card w-100 shadow border-0" style="max-width:460px" id="loginForm">
      <div class="card-body p-4">
        <h1 class="h4 fw-bold text-center mb-1">Login</h1>
        <p class="text-center text-muted small mb-4">Welcome back, log in to continue</p>

        <div class="alert alert-danger py-2 small d-none" id="error" role="alert"></div>
        <div class="mb-3">
          <label for="email" class="form-label small mb-1">Email</label>
          <input type="email" class="form-control" id="email" placeholder="Enter your email" required />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label small mb-1">Password</label>
          <input type="password" class="form-control" id="password" placeholder="Enter your password" required />
        </div>

        <button type="submit" class="btn btn-primary w-100 fw-semibold mt-2">Login</button>

        <p class="text-center small mt-3 mb-0">Don't have an account? <a href="signup.html">Sign up</a></p>
      </div>
    </form>
  </div>

  <script type="module" src="login.js"></script>
</body>
</html>
